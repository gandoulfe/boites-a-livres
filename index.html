<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boîte la plus proche</title>
<meta name="theme-color" content="#1f3b2d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
/* Layout : carte plein écran, barre de recherche flottante en haut, fiche "boîte" en bas comme une étiquette d'emprunt. */
:root {
  --ink: #1f2a24;
  --paper: #f7f8f4;
  --card: #ffffff;
  --muted: #5d6b63;
  --line: #d9e0da;
  --green: #1f3b2d;     /* vert bouteille, couleur des boîtes en bois peintes */
  --mustard: #e3a81b;   /* étiquette / accent */
  --mustard-ink: #1f2a24;
  --me: #2563eb;
  --shadow: 0 6px 24px rgba(20, 35, 28, .18);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e7ece8; --paper: #121815; --card: #1a221e; --muted: #9aa8a0; --line: #2c3832;
    --green: #8fd1a8; --mustard: #f0b93a; --mustard-ink: #1a1405; --me: #60a5fa;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e7ece8; --paper: #121815; --card: #1a221e; --muted: #9aa8a0; --line: #2c3832;
  --green: #8fd1a8; --mustard: #f0b93a; --mustard-ink: #1a1405; --me: #60a5fa;
  --shadow: 0 6px 24px rgba(0, 0, 0, .5); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font: 16px/1.4 var(--f-body); overflow: hidden; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }

#map { position: fixed; inset: 0; background: var(--paper); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .leaflet-tile-pane { filter: brightness(.75) contrast(1.1) saturate(.7) invert(1) hue-rotate(180deg); }
}

/* Barre du haut */
.top {
  position: fixed; z-index: 1000; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 6px; pointer-events: none;
}
.bar {
  pointer-events: auto; display: flex; align-items: center; gap: 8px;
  background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 6px 6px 6px 12px;
  max-width: 560px; width: 100%; margin: 0 auto;
}
.brand { font: 800 15px/1 var(--f-display); color: var(--green); letter-spacing: -.01em; white-space: nowrap; }
.bar input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 4px; outline: none; }
.bar input::placeholder { color: var(--muted); }
.results {
  pointer-events: auto; list-style: none; margin: 0 auto; padding: 4px; max-width: 560px; width: 100%;
  background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
}
.results li button { width: 100%; text-align: left; border: 0; background: none; padding: 10px; border-radius: 8px; cursor: pointer; }
.results li button:hover { background: var(--line); }
.results small { color: var(--muted); }

.icon-btn {
  border: 0; background: var(--green); color: var(--paper); width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center; cursor: pointer; flex: none;
}
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn.ghost { background: transparent; color: var(--muted); }

/* Fiche du bas */
.sheet {
  position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.card {
  pointer-events: auto; max-width: 560px; margin: 0 auto; background: var(--card);
  border-radius: 18px; box-shadow: var(--shadow); overflow: hidden;
}
.tag {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--mustard); color: var(--mustard-ink); padding: 8px 14px;
  font: 700 12px/1 var(--f-body); letter-spacing: .08em; text-transform: uppercase;
}
.tag .num { font-variant-numeric: tabular-nums; letter-spacing: .04em; }
.body { padding: 14px; display: grid; gap: 12px; }
.headline { display: flex; align-items: center; gap: 14px; }
.dist { font: 800 clamp(34px, 10vw, 46px)/.95 var(--f-display); color: var(--green); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.dist small { font-size: .45em; font-weight: 600; letter-spacing: 0; margin-left: 2px; }
.arrow { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; color: var(--green); transition: transform .4s ease; }
.arrow svg { width: 22px; height: 22px; }
.meta { min-width: 0; }
.addr { font-weight: 700; overflow-wrap: anywhere; }
.sub { color: var(--muted); font-size: 14px; }
.actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.go {
  border: 0; border-radius: 12px; background: var(--green); color: var(--paper); padding: 14px; cursor: pointer;
  font: 700 17px/1 var(--f-body); display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
}
.go svg { width: 20px; height: 20px; }
.alt { border: 2px solid var(--line); background: transparent; border-radius: 12px; padding: 0 14px; cursor: pointer; font-weight: 700; color: var(--ink); text-decoration: none; display: grid; place-items: center; }
.apps { display: flex; gap: 8px; flex-wrap: wrap; }
.apps a { flex: 1 1 0; min-width: 90px; text-align: center; border: 2px solid var(--line); border-radius: 10px; padding: 10px 6px; color: var(--ink); text-decoration: none; font-weight: 700; font-size: 14px; }
.apps a:hover { border-color: var(--green); }
.more { border-top: 1px solid var(--line); }
.more summary { padding: 12px 14px; cursor: pointer; font-weight: 700; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
.more summary::-webkit-details-marker { display: none; }
.more summary::after { content: "▾"; }
.more[open] summary::after { content: "▴"; }
.list { list-style: none; margin: 0; padding: 0 6px 6px; max-height: 32vh; overflow-y: auto; }
.list button { width: 100%; display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: baseline; text-align: left; border: 0; background: none; padding: 9px 8px; border-radius: 8px; cursor: pointer; }
.list button:hover, .list button[aria-current="true"] { background: var(--line); }
.list .d { font: 700 15px/1 var(--f-display); color: var(--green); font-variant-numeric: tabular-nums; text-align: right; }
.list .a { font-size: 14px; overflow-wrap: anywhere; }
.empty { padding: 16px; display: grid; gap: 10px; }
.empty h1 { margin: 0; font: 800 24px/1.1 var(--f-display); color: var(--green); text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); }
.status { color: var(--muted); font-size: 13px; }

/* Marqueurs */
.box-pin { width: 26px; height: 26px; border-radius: 7px; background: var(--green); border: 2px solid var(--card); box-shadow: 0 2px 6px rgba(0,0,0,.3); display: grid; place-items: center; }
.box-pin svg { width: 14px; height: 14px; color: var(--paper); }
.box-pin.sel { background: var(--mustard); transform: scale(1.3); }
.box-pin.sel svg { color: var(--mustard-ink); }
.me-dot { width: 18px; height: 18px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 6px color-mix(in srgb, var(--me) 25%, transparent); }
.marker-cluster div { background: var(--green); color: var(--paper); font: 700 13px/30px var(--f-body); width: 30px; height: 30px; margin: 5px; border-radius: 50%; text-align: center; }
.marker-cluster { background: color-mix(in srgb, var(--green) 30%, transparent); border-radius: 50%; }
.leaflet-control-attribution { font-size: 10px; }
.leaflet-bottom { bottom: 0; }
@media (prefers-reduced-motion: reduce) { .arrow { transition: none; } }
</style>
</head>
<body>
<div id="map" aria-label="Carte des boîtes à livres"></div>

<div class="top">
  <form class="bar" id="searchForm" role="search">
    <span class="brand">Boîtes à livres</span>
    <input id="q" type="search" placeholder="Une adresse, une ville…" autocomplete="off" aria-label="Rechercher une adresse">
    <button class="icon-btn" id="locateBtn" type="button" title="Me localiser" aria-label="Me localiser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </form>
  <ul class="results" id="results" hidden></ul>
</div>

<div class="sheet">
  <div class="card" id="card">
    <div class="empty" id="empty">
      <h1>Où est la boîte à livres la plus proche ?</h1>
      <p>Autorise la localisation, ou cherche une adresse en haut. <span id="count">19 080</span> boîtes recensées en France.</p>
      <button class="go" id="startBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        Me localiser
      </button>
      <span class="status" id="status" role="status"></span>
    </div>
    <div id="detail" hidden>
      <div class="tag"><span id="tagLabel">La plus proche</span><span class="num" id="boxNum"></span></div>
      <div class="body">
        <div class="headline">
          <div class="arrow" id="arrow" title="Direction">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l6 18-6-4-6 4z"/></svg>
          </div>
          <div class="dist" id="dist"></div>
          <div class="meta">
            <div class="sub" id="eta"></div>
          </div>
        </div>
        <div>
          <div class="addr" id="addr"></div>
          <div class="sub" id="coords"></div>
        </div>
        <div class="actions">
          <a class="go" id="goBtn" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"/></svg>
            <span id="goLabel">Y aller</span>
          </a>
          <a class="alt" id="ficheBtn" target="_blank" rel="noopener" title="Voir la fiche sur boites-a-livres.fr">Fiche</a>
        </div>
        <div class="apps" id="apps">
          <a id="gmaps" target="_blank" rel="noopener">Google Maps</a>
          <a id="amaps" target="_blank" rel="noopener">Plans</a>
          <a id="waze" target="_blank" rel="noopener">Waze</a>
        </div>
      </div>
      <details class="more" id="more">
        <summary>Les 10 plus proches</summary>
        <ul class="list" id="list"></ul>
      </details>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const $ = id => document.getElementById(id);
const BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>';
const IS_APPLE = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);

let boxes = [];          // [lat, lon, id, adresse]
let origin = null;       // {lat, lon, fromGps}
let selected = null;     // index dans boxes
let nearest = [];        // indices triés
let heading = null;
const markers = new Map();

// --- Carte
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([46.6, 2.4], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap · données <a href="https://www.boites-a-livres.fr/" target="_blank">boites-a-livres.fr</a>'
}).addTo(map);
const cluster = L.markerClusterGroup({ chunkedLoading: true, showCoverageOnHover: false, maxClusterRadius: 50, disableClusteringAtZoom: 16 });
map.addLayer(cluster);
const pinIcon = sel => L.divIcon({ className: '', html: `<div class="box-pin${sel ? ' sel' : ''}">${BOOK}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] });
const ICON = pinIcon(false), ICON_SEL = pinIcon(true);
let meMarker = null, meCircle = null, line = null;

// --- Géo
const R = 6371000, rad = d => d * Math.PI / 180;
function dist(a, b, c, d) {
  const x = Math.sin(rad(c - a) / 2) ** 2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(rad(d - b) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b, c, d) {
  const y = Math.sin(rad(d - b)) * Math.cos(rad(c));
  const x = Math.cos(rad(a)) * Math.sin(rad(c)) - Math.sin(rad(a)) * Math.cos(rad(c)) * Math.cos(rad(d - b));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
const CARD = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
const fmt = m => m < 1000 ? [Math.round(m / 10) * 10 || Math.round(m), 'm'] : [(m / 1000).toFixed(m < 10000 ? 1 : 0).replace('.', ','), 'km'];
const fmtTxt = m => fmt(m).join(' ');
function eta(m) {
  if (m < 2500) return `≈ ${Math.max(1, Math.round(m / 80))} min à pied`;
  if (m < 8000) return `≈ ${Math.round(m / 250)} min à vélo`;
  return `≈ ${Math.round(m / 700) + 3} min en voiture`;
}

// --- Liens
function slug(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x'; }
function ficheUrl(b) {
  const m = b[3].match(/(\d{5})\s+(.+)$/);
  return `https://www.boites-a-livres.fr/ville/${m ? slug(m[2]) : 'x'}/${m ? m[1] : '00000'}/boite-${b[2]}`;
}
function navLinks(b, walking) {
  const ll = `${b[0]},${b[1]}`;
  return {
    g: `https://www.google.com/maps/dir/?api=1&destination=${ll}&travelmode=${walking ? 'walking' : 'driving'}`,
    a: `https://maps.apple.com/?daddr=${ll}&dirflg=${walking ? 'w' : 'd'}`,
    w: `https://waze.com/ul?ll=${ll}&navigate=yes`
  };
}

// --- Rendu
function computeNearest() {
  if (!origin) return;
  const d = new Float64Array(boxes.length);
  for (let i = 0; i < boxes.length; i++) d[i] = dist(origin.lat, origin.lon, boxes[i][0], boxes[i][1]);
  // sélection partielle des 10 plus proches
  const top = [];
  for (let i = 0; i < d.length; i++) {
    if (top.length < 10 || d[i] < d[top[top.length - 1]]) {
      top.push(i); top.sort((x, y) => d[x] - d[y]); if (top.length > 10) top.pop();
    }
  }
  nearest = top;
}

function setSelected(i, { fit = false } = {}) {
  if (selected !== null && markers.get(selected)) markers.get(selected).setIcon(ICON);
  selected = i;
  const mk = markers.get(i);
  if (mk) { mk.setIcon(ICON_SEL); mk.setZIndexOffset(1000); }
  render();
  const b = boxes[i];
  if (fit && origin) map.fitBounds(L.latLngBounds([[origin.lat, origin.lon], [b[0], b[1]]]).pad(0.35), { paddingBottomRight: [0, 280], paddingTopLeft: [0, 70], maxZoom: 17 });
  else if (fit) map.setView([b[0], b[1]], 16);
}

function render() {
  if (selected === null) return;
  $('empty').hidden = true; $('detail').hidden = false;
  const b = boxes[selected];
  $('boxNum').textContent = `n° ${b[2]}`;
  $('addr').textContent = b[3] || 'Adresse inconnue';
  $('coords').textContent = `${b[0].toFixed(5)}, ${b[1].toFixed(5)}`;
  $('ficheBtn').href = ficheUrl(b);
  if (origin) {
    const m = dist(origin.lat, origin.lon, b[0], b[1]);
    const [v, u] = fmt(m);
    $('dist').innerHTML = `${v}<small>${u}</small>`;
    const br = bearing(origin.lat, origin.lon, b[0], b[1]);
    $('eta').textContent = `${eta(m)} · direction ${CARD[Math.round(br / 45) % 8]}`;
    $('arrow').style.transform = `rotate(${br - (heading ?? 0)}deg)`;
    $('arrow').hidden = false;
    $('tagLabel').textContent = selected === nearest[0] ? (origin.fromGps ? 'La plus proche de toi' : 'La plus proche de cette adresse') : 'Boîte sélectionnée';
    const walking = m < 3000, L2 = navLinks(b, walking);
    $('gmaps').href = L2.g; $('amaps').href = L2.a; $('waze').href = L2.w;
    $('goBtn').href = IS_APPLE ? L2.a : L2.g;
    $('goLabel').textContent = walking ? 'Y aller à pied' : 'Y aller';
    if (line) line.setLatLngs([[origin.lat, origin.lon], [b[0], b[1]]]);
    else line = L.polyline([[origin.lat, origin.lon], [b[0], b[1]]], { color: getComputedStyle(document.documentElement).getPropertyValue('--mustard').trim(), weight: 4, dashArray: '2 8', lineCap: 'round' }).addTo(map);
  } else {
    $('dist').textContent = ''; $('arrow').hidden = true;
    $('eta').textContent = 'Localise-toi pour voir la distance';
    $('tagLabel').textContent = 'Boîte sélectionnée';
    const L2 = navLinks(b, true);
    $('gmaps').href = L2.g; $('amaps').href = L2.a; $('waze').href = L2.w;
    $('goBtn').href = IS_APPLE ? L2.a : L2.g; $('goLabel').textContent = 'Y aller';
  }
  $('more').hidden = !origin;
  $('list').innerHTML = '';
  for (const i of nearest) {
    const n = boxes[i], li = document.createElement('li'), bt = document.createElement('button');
    bt.innerHTML = `<span class="d">${fmtTxt(dist(origin.lat, origin.lon, n[0], n[1]))}</span><span class="a"></span>`;
    bt.querySelector('.a').textContent = n[3] || `Boîte n° ${n[2]}`;
    if (i === selected) bt.setAttribute('aria-current', 'true');
    bt.onclick = () => setSelected(i, { fit: true });
    li.append(bt); $('list').append(li);
  }
}

function setOrigin(lat, lon, fromGps, acc) {
  const first = !origin;
  const moved = origin ? dist(origin.lat, origin.lon, lat, lon) : Infinity;
  origin = { lat, lon, fromGps };
  if (!meMarker) meMarker = L.marker([lat, lon], { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 2000, interactive: false }).addTo(map);
  else meMarker.setLatLng([lat, lon]);
  if (acc && fromGps) { meCircle ? meCircle.setLatLng([lat, lon]).setRadius(acc) : (meCircle = L.circle([lat, lon], { radius: acc, weight: 0, fillOpacity: .12, interactive: false }).addTo(map)); }
  else if (meCircle) { map.removeLayer(meCircle); meCircle = null; }
  try { localStorage.setItem('bal-last', JSON.stringify([lat, lon])); } catch (e) {}
  if (first || moved > 40 || !fromGps) {
    const prevFirst = nearest[0];
    computeNearest();
    // On suit la plus proche, sauf si l'utilisateur a choisi une autre boîte
    if (selected === null || selected === prevFirst || !fromGps) { setSelected(nearest[0], { fit: first || !fromGps }); return; }
  }
  render();
}

// --- Localisation
let watchId = null;
function locate() {
  if (!('geolocation' in navigator)) { $('status').textContent = "Ce navigateur ne donne pas accès à la position. Cherche une adresse en haut."; return; }
  $('status').textContent = 'Recherche de ta position…';
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  let centered = false;
  watchId = navigator.geolocation.watchPosition(p => {
    $('status').textContent = '';
    setOrigin(p.coords.latitude, p.coords.longitude, true, p.coords.accuracy);
    if (!centered && nearest.length) setSelected(nearest[0], { fit: true });
    centered = true;
  }, err => {
    const msg = err.code === 1 ? "Localisation refusée. Autorise-la dans les réglages du navigateur, ou cherche une adresse."
      : "Position introuvable pour l'instant. Réessaie, ou cherche une adresse.";
    $('status').textContent = msg;
    if (!$('detail').hidden) $('eta').textContent = msg;
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
$('locateBtn').onclick = locate;
$('startBtn').onclick = locate;

// Boussole (orientation de l'appareil) : la flèche pointe vers la boîte
function onOrient(e) {
  const h = e.webkitCompassHeading ?? (e.absolute && e.alpha != null ? 360 - e.alpha : null);
  if (h == null) return;
  heading = h;
  if (origin && selected !== null) {
    const b = boxes[selected];
    $('arrow').style.transform = `rotate(${bearing(origin.lat, origin.lon, b[0], b[1]) - heading}deg)`;
  }
}
$('arrow').onclick = async () => {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    }
    window.addEventListener('deviceorientationabsolute', onOrient);
    window.addEventListener('deviceorientation', onOrient);
    $('arrow').title = 'Boussole activée';
  } catch (e) {}
};

// --- Recherche d'adresse (Base Adresse Nationale)
let qTimer = null;
$('q').addEventListener('input', () => {
  clearTimeout(qTimer);
  const q = $('q').value.trim();
  if (q.length < 3) { $('results').hidden = true; return; }
  qTimer = setTimeout(() => search(q), 250);
});
$('searchForm').addEventListener('submit', e => { e.preventDefault(); const f = $('results').querySelector('button'); if (f) f.click(); });
async function search(q) {
  try {
    const r = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&limit=5`);
    const j = await r.json();
    const ul = $('results'); ul.innerHTML = '';
    for (const f of j.features) {
      const li = document.createElement('li'), bt = document.createElement('button');
      bt.type = 'button';
      bt.innerHTML = '<span></span><br><small></small>';
      bt.querySelector('span').textContent = f.properties.label;
      bt.querySelector('small').textContent = f.properties.context;
      bt.onclick = () => {
        ul.hidden = true; $('q').value = f.properties.label; $('q').blur();
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        const [lon, lat] = f.geometry.coordinates;
        setOrigin(lat, lon, false);
      };
      li.append(bt); ul.append(li);
    }
    ul.hidden = !j.features.length;
  } catch (e) { $('results').hidden = true; }
}
document.addEventListener('click', e => { if (!e.target.closest('.top')) $('results').hidden = true; });

// --- Données
fetch('data/boites.json').then(r => r.json()).then(data => {
  boxes = data;
  $('count').textContent = boxes.length.toLocaleString('fr-FR');
  const list = boxes.map((b, i) => {
    const m = L.marker([b[0], b[1]], { icon: ICON, title: b[3] });
    m.on('click', () => setSelected(i));
    markers.set(i, m);
    return m;
  });
  cluster.addLayers(list);
  // Reprend la dernière position connue en attendant le GPS
  try {
    const last = JSON.parse(localStorage.getItem('bal-last') || 'null');
    if (last) map.setView(last, 14);
  } catch (e) {}
  if (navigator.permissions) navigator.permissions.query({ name: 'geolocation' }).then(p => { if (p.state === 'granted') locate(); }).catch(() => {});
});
