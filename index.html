<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Boîte la plus proche</title>
<meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0d12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
/* Layout : carte plein écran ; contrôles en verre flottants (recherche en pilule, bouton de localisation, feuille du bas avec poignée). */
:root {
  --bg: #f2f3f7;
  --text: #0c0d12;
  --muted: #5d6273;
  --glass: rgba(255, 255, 255, .72);
  --glass-strong: rgba(255, 255, 255, .9);
  --hair: rgba(12, 16, 32, .08);
  --fill: rgba(12, 16, 32, .05);
  --fill-hover: rgba(12, 16, 32, .09);
  --a1: #ff6a3d;        /* mandarine */
  --a2: #f0307f;        /* framboise */
  --accent-text: #d92a6c;
  --on-accent: #ffffff;
  --me: #0a84ff;
  --pin-ring: #ffffff;
  --shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 12px 40px rgba(16, 20, 40, .16), 0 2px 8px rgba(16, 20, 40, .08);
  --grad: linear-gradient(135deg, var(--a1), var(--a2));
  --f: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-xl: 28px; --r-lg: 20px; --r-md: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0d12; --text: #f3f4f8; --muted: #9a9fb0;
    --glass: rgba(26, 28, 36, .66); --glass-strong: rgba(26, 28, 36, .9);
    --hair: rgba(255, 255, 255, .09); --fill: rgba(255, 255, 255, .06); --fill-hover: rgba(255, 255, 255, .11);
    --a1: #ff7a4d; --a2: #ff4f9a; --accent-text: #ff7aae; --pin-ring: #1a1c24;
    --shadow: 0 1px 0 rgba(255,255,255,.07) inset, 0 12px 40px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0d12; --text: #f3f4f8; --muted: #9a9fb0;
  --glass: rgba(26, 28, 36, .66); --glass-strong: rgba(26, 28, 36, .9);
  --hair: rgba(255, 255, 255, .09); --fill: rgba(255, 255, 255, .06); --fill-hover: rgba(255, 255, 255, .11);
  --a1: #ff7a4d; --a2: #ff4f9a; --accent-text: #ff7aae; --pin-ring: #1a1c24;
  --shadow: 0 1px 0 rgba(255,255,255,.07) inset, 0 12px 40px rgba(0, 0, 0, .5), 0 2px 8px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 16px/1.4 var(--f); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--a2); outline-offset: 2px; }

.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  border: 1px solid var(--hair);
  box-shadow: var(--shadow);
}
@media (prefers-reduced-transparency: reduce) { .glass { background: var(--glass-strong); } }

#map { position: fixed; inset: 0; background: var(--bg); }

/* Haut : recherche + localisation */
.top {
  position: fixed; z-index: 1000; left: 0; right: 0; top: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.top-inner { max-width: 560px; margin: 0 auto; display: grid; gap: 8px; }
.row { display: flex; gap: 10px; }
.search {
  pointer-events: auto; flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  height: 50px; padding: 0 18px; border-radius: 999px;
}
.search svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 16px; font-weight: 500; }
.search input::placeholder { color: var(--muted); font-weight: 400; }
.search input::-webkit-search-cancel-button { display: none; }
.round {
  pointer-events: auto; width: 50px; height: 50px; border-radius: 50%; flex: none;
  display: grid; place-items: center; cursor: pointer; color: var(--text);
}
.round svg { width: 22px; height: 22px; }
.round.on { color: var(--me); }
.results { pointer-events: auto; list-style: none; margin: 0; padding: 6px; border-radius: var(--r-lg); }
.results button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: var(--r-md); cursor: pointer; display: grid; gap: 2px; }
.results button:hover, .results button:focus-visible { background: var(--fill-hover); }
.results .l { font-weight: 600; }
.results small { color: var(--muted); font-size: 13px; }

/* Feuille du bas */
.sheet {
  position: fixed; z-index: 1000; left: 0; right: 0; bottom: 0;
  padding: 0 max(10px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(10px, env(safe-area-inset-left, 0px));
  pointer-events: none;
}
.card { pointer-events: auto; max-width: 560px; margin: 0 auto; border-radius: var(--r-xl); overflow: hidden; }
.grab { display: block; width: 100%; height: 22px; border: 0; background: none; cursor: pointer; position: relative; }
.grab::before { content: ""; position: absolute; left: 50%; top: 9px; width: 38px; height: 5px; margin-left: -19px; border-radius: 3px; background: var(--hair); background: color-mix(in srgb, var(--text) 22%, transparent); }
.inner { padding: 0 18px 18px; display: grid; gap: 14px; }

.eyebrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px;
  background: var(--fill); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap;
}
.chip.hot { background: color-mix(in srgb, var(--a2) 14%, transparent); color: var(--accent-text); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--grad); }
.num { font-variant-numeric: tabular-nums; }

.hero { display: flex; align-items: flex-end; gap: 14px; }
.dist {
  font-size: clamp(48px, 15vw, 64px); font-weight: 800; line-height: .9; letter-spacing: -.045em; font-variant-numeric: tabular-nums;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.dist small { font-size: .38em; font-weight: 700; letter-spacing: -.01em; margin-left: 3px; }
.hero-side { display: grid; gap: 6px; padding-bottom: 4px; min-width: 0; }
.eta { font-weight: 600; font-size: 15px; }
.dir { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 500; background: none; border: 0; padding: 0; cursor: pointer; }
.arrow { width: 26px; height: 26px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.arrow svg { width: 13px; height: 13px; color: var(--accent-text); }

.addr { font-size: 17px; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.coords { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 2px; }

.cta {
  height: 56px; border-radius: 999px; border: 0; cursor: pointer; text-decoration: none;
  background: var(--grad); color: var(--on-accent); font-weight: 700; font-size: 17px; letter-spacing: -.01em;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--a2) 35%, transparent);
  transition: transform .15s ease, box-shadow .15s ease;
}
.cta:hover { box-shadow: 0 10px 30px color-mix(in srgb, var(--a2) 45%, transparent); }
.cta:active { transform: scale(.98); }
.cta svg { width: 20px; height: 20px; }

.seg { display: flex; gap: 8px; }
.seg a {
  flex: 1 1 0; min-width: 0; height: 44px; border-radius: 999px; background: var(--fill);
  display: flex; align-items: center; justify-content: center; gap: 6px;
  color: var(--text); text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap;
  transition: background .15s ease;
}
.seg a:hover { background: var(--fill-hover); }
.seg a svg { width: 16px; height: 16px; flex: none; }
.seg .fiche { flex: 0 0 44px; }

.more { border-top: 1px solid var(--hair); }
.more summary { padding: 14px 18px; cursor: pointer; font-weight: 600; font-size: 15px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.more summary::-webkit-details-marker { display: none; }
.more summary svg { width: 18px; height: 18px; color: var(--muted); transition: transform .2s ease; }
.more[open] summary svg { transform: rotate(180deg); }
.list { list-style: none; margin: 0; padding: 0 8px 10px; max-height: 34vh; overflow-y: auto; display: grid; gap: 2px; }
.list button { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; text-align: left; border: 0; background: none; padding: 10px 10px; border-radius: var(--r-md); cursor: pointer; }
.list button:hover { background: var(--fill-hover); }
.list button[aria-current="true"] { background: var(--fill); }
.list .a { font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
.list .d { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--accent-text); }

/* Fiche pliée : une seule ligne, la carte reste dégagée */
.grab { touch-action: none; }
.peek { display: none; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; padding: 0 12px 12px 18px; cursor: pointer; touch-action: none; }
.pdist { font-size: 30px; font-weight: 800; letter-spacing: -.04em; line-height: 1; font-variant-numeric: tabular-nums; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pdist small { font-size: .5em; font-weight: 700; margin-left: 2px; }
.pmeta { min-width: 0; }
.paddr { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.peta { color: var(--muted); font-size: 13px; }
.pgo { width: 48px; height: 48px; border-radius: 50%; background: var(--grad); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 6px 18px color-mix(in srgb, var(--a2) 35%, transparent); }
.pgo svg { width: 20px; height: 20px; }
.card.mini .peek { display: grid; }
.card.mini .inner, .card.mini .more { display: none; }
.card.mini .empty { padding-top: 0; padding-bottom: 14px; }
.card.mini .empty > :not(.cta):not(.status) { display: none; }
.card { transition: border-radius .2s ease; }
.card.mini { border-radius: 24px; }

.empty { padding: 4px 20px 20px; display: grid; gap: 14px; }
.empty .kicker { font-size: 13px; font-weight: 600; color: var(--accent-text); letter-spacing: .02em; }
.empty h1 { margin: 0; font-size: 28px; line-height: 1.08; font-weight: 800; letter-spacing: -.035em; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); font-size: 15px; }
.status { color: var(--muted); font-size: 13px; }
.status:empty { display: none; }

/* Marqueurs */
.pin {
  width: 30px; height: 30px; border-radius: 11px; background: var(--grad);
  border: 2.5px solid var(--pin-ring); box-shadow: 0 4px 12px rgba(0,0,0,.25);
  display: grid; place-items: center; transition: transform .2s ease;
}
.pin svg { width: 15px; height: 15px; color: #fff; }
.pin.sel { transform: scale(1.35); box-shadow: 0 0 0 6px color-mix(in srgb, var(--a2) 30%, transparent), 0 6px 16px rgba(0,0,0,.3); }
.me { width: 20px; height: 20px; border-radius: 50%; background: var(--me); border: 3px solid #fff; box-shadow: 0 0 0 8px color-mix(in srgb, var(--me) 22%, transparent), 0 2px 6px rgba(0,0,0,.3); }
.marker-cluster { background: transparent !important; }
.marker-cluster div {
  width: 38px !important; height: 38px !important; margin: 1px !important; border-radius: 50%;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border: 2px solid transparent; background-clip: padding-box;
  box-shadow: 0 0 0 2px var(--a2), 0 4px 14px rgba(0,0,0,.2);
  color: var(--text); font: 700 13px/34px var(--f); text-align: center; font-variant-numeric: tabular-nums;
}
.marker-cluster span { line-height: 34px; }
.leaflet-container { font-family: var(--f); background: var(--bg); }
.leaflet-control-attribution { font-size: 10px; background: var(--glass) !important; color: var(--muted) !important; border-radius: 8px 0 0 0; }
.leaflet-control-attribution a { color: var(--muted) !important; }
@media (prefers-reduced-motion: reduce) { .arrow, .pin, .cta, .more summary svg { transition: none; } }
</style>
</head>
<body>
<div id="map" aria-label="Carte des boîtes à livres"></div>

<div class="top">
  <div class="top-inner">
    <div class="row">
      <form class="search glass" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Rechercher une adresse" autocomplete="off" aria-label="Rechercher une adresse">
      </form>
      <button class="round glass" id="locateBtn" type="button" title="Me localiser" aria-label="Me localiser">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 2.6a1 1 0 0 0-1.1-.2L3.1 9.8a1 1 0 0 0 .1 1.9l7.1 2 2 7.1a1 1 0 0 0 1.9.1l7.4-17.2a1 1 0 0 0-.2-1.1z"/></svg>
      </button>
    </div>
    <ul class="results glass" id="results" hidden></ul>
  </div>
</div>

<div class="sheet">
  <div class="card glass" id="card">
    <button class="grab" id="grab" type="button" aria-label="Plier ou déplier la fiche" aria-expanded="true"></button>
    <div class="empty" id="empty">
      <span class="kicker"><span id="count">19 080</span> boîtes à livres en France</span>
      <h1>Trouve la boîte à livres la plus proche</h1>
      <p>Active la localisation, ou cherche une adresse en haut.</p>
      <button class="cta" id="startBtn" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.4 2.6a1 1 0 0 0-1.1-.2L3.1 9.8a1 1 0 0 0 .1 1.9l7.1 2 2 7.1a1 1 0 0 0 1.9.1l7.4-17.2a1 1 0 0 0-.2-1.1z"/></svg>
        Me localiser
      </button>
      <span class="status" id="status" role="status"></span>
    </div>
    <div id="detail" hidden>
      <div class="peek" id="peek" role="button" tabindex="0" aria-label="Déplier la fiche">
        <div class="pdist" id="pdist"></div>
        <div class="pmeta"><div class="paddr" id="paddr"></div><div class="peta" id="peta"></div></div>
        <a class="pgo" id="pgo" target="_blank" rel="noopener" aria-label="Y aller">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </div>
      <div class="inner">
        <div class="eyebrow">
          <span class="chip hot"><span class="dot"></span><span id="tagLabel">La plus proche</span></span>
          <span class="chip num" id="boxNum"></span>
        </div>
        <div class="hero">
          <div class="dist" id="dist"></div>
          <div class="hero-side">
            <div class="eta" id="eta"></div>
            <button class="dir" id="dirBtn" type="button" title="Activer la boussole">
              <span class="arrow" id="arrow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l7 19-7-4-7 4z"/></svg></span>
              <span id="dirTxt"></span>
            </button>
          </div>
        </div>
        <div>
          <div class="addr" id="addr"></div>
          <div class="coords" id="coords"></div>
        </div>
        <a class="cta" id="goBtn" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          <span id="goLabel">Y aller</span>
        </a>
        <div class="seg">
          <a id="gmaps" target="_blank" rel="noopener">Google Maps</a>
          <a id="amaps" target="_blank" rel="noopener">Plans</a>
          <a id="waze" target="_blank" rel="noopener">Waze</a>
          <a class="fiche" id="ficheBtn" target="_blank" rel="noopener" title="Fiche sur boites-a-livres.fr" aria-label="Fiche sur boites-a-livres.fr">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
          </a>
        </div>
      </div>
      <details class="more" id="more">
        <summary>Les 10 plus proches <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg></summary>
        <ul class="list" id="list"></ul>
      </details>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
<script>
const $ = id => document.getElementById(id);
const BOOK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>';
const IS_APPLE = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let boxes = [];          // [lat, lon, id, adresse]
let origin = null;       // {lat, lon, fromGps}
let selected = null;     // index dans boxes
let nearest = [];        // indices triés
let heading = null;
const markers = new Map();

// --- Carte (fond vectoriel OpenFreeMap, clair / sombre selon le thème)
const map = L.map('map', { zoomControl: false, attributionControl: true, maxZoom: 20 }).setView([46.6, 2.4], 6);
const ATTR = '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> · © <a href="https://www.openstreetmap.org/copyright" target="_blank">OSM</a> · <a href="https://www.boites-a-livres.fr/" target="_blank">boites-a-livres.fr</a>';
const darkMq = matchMedia('(prefers-color-scheme: dark)');
let tiles = null;
function setTiles() {
  const style = `https://tiles.openfreemap.org/styles/${darkMq.matches ? 'dark' : 'positron'}`;
  if (tiles) map.removeLayer(tiles);
  tiles = L.maplibreGL({ style, attribution: ATTR }).addTo(map);
  if (line) line.setStyle({ color: css('--a2') });
}
darkMq.addEventListener?.('change', setTiles);

const cluster = L.markerClusterGroup({
  chunkedLoading: true, showCoverageOnHover: false, maxClusterRadius: 55, disableClusteringAtZoom: 16,
  iconCreateFunction: c => L.divIcon({ html: `<div><span>${c.getChildCount()}</span></div>`, className: 'marker-cluster', iconSize: [40, 40] })
});
map.addLayer(cluster);
const pinIcon = sel => L.divIcon({ className: '', html: `<div class="pin${sel ? ' sel' : ''}">${BOOK}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
const ICON = pinIcon(false), ICON_SEL = pinIcon(true);
let meMarker = null, meCircle = null, line = null;
setTiles();

// --- Géo
const R = 6371000, rad = d => d * Math.PI / 180;
function dist(a, b, c, d) {
  const x = Math.sin(rad(c - a) / 2) ** 2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(rad(d - b) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function bearing(a, b, c, d) {
  const y = Math.sin(rad(d - b)) * Math.cos(rad(c));
  const x = Math.cos(rad(a)) * Math.sin(rad(c)) - Math.sin(rad(a)) * Math.cos(rad(c)) * Math.cos(rad(d - b));
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
const CARD = ['nord', 'nord-est', 'est', 'sud-est', 'sud', 'sud-ouest', 'ouest', 'nord-ouest'];
const fmt = m => m < 1000 ? [Math.round(m / 10) * 10 || Math.round(m), 'm'] : [(m / 1000).toFixed(m < 10000 ? 1 : 0).replace('.', ','), 'km'];
const fmtTxt = m => fmt(m).join(' ');
function eta(m) {
  if (m < 2500) return `${Math.max(1, Math.round(m / 80))} min à pied`;
  if (m < 8000) return `${Math.round(m / 250)} min à vélo`;
  return `${Math.round(m / 700) + 3} min en voiture`;
}

// --- Liens
function slug(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'x'; }
function ficheUrl(b) {
  const m = b[3].match(/(\d{5})\s+(.+)$/);
  return `https://www.boites-a-livres.fr/ville/${m ? slug(m[2]) : 'x'}/${m ? m[1] : '00000'}/boite-${b[2]}`;
}
function navLinks(b, walking) {
  const ll = `${b[0]},${b[1]}`;
  return {
    g: `https://www.google.com/maps/dir/?api=1&destination=${ll}&travelmode=${walking ? 'walking' : 'driving'}`,
    a: `https://maps.apple.com/?daddr=${ll}&dirflg=${walking ? 'w' : 'd'}`,
    w: `https://waze.com/ul?ll=${ll}&navigate=yes`
  };
}

// --- Rendu
function computeNearest() {
  if (!origin) return;
  const d = new Float64Array(boxes.length);
  for (let i = 0; i < boxes.length; i++) d[i] = dist(origin.lat, origin.lon, boxes[i][0], boxes[i][1]);
  // sélection partielle des 10 plus proches
  const top = [];
  for (let i = 0; i < d.length; i++) {
    if (top.length < 10 || d[i] < d[top[top.length - 1]]) {
      top.push(i); top.sort((x, y) => d[x] - d[y]); if (top.length > 10) top.pop();
    }
  }
  nearest = top;
}

function setSelected(i, { fit = false } = {}) {
  if (selected !== null && markers.get(selected)) { markers.get(selected).setIcon(ICON); markers.get(selected).setZIndexOffset(0); }
  selected = i;
  const mk = markers.get(i);
  if (mk) { mk.setIcon(ICON_SEL); mk.setZIndexOffset(1000); }
  render();
  const b = boxes[i];
  const bottom = $('card').offsetHeight + 20;
  if (fit && origin) map.fitBounds(L.latLngBounds([[origin.lat, origin.lon], [b[0], b[1]]]).pad(0.3), { paddingBottomRight: [20, bottom], paddingTopLeft: [20, 90], maxZoom: 17 });
  else if (fit) map.setView([b[0], b[1]], 16);
}

function render() {
  if (selected === null) return;
  $('empty').hidden = true; $('detail').hidden = false;
  const b = boxes[selected];
  $('boxNum').textContent = `n° ${b[2]}`;
  $('addr').textContent = b[3] || 'Adresse inconnue';
  $('coords').textContent = `${b[0].toFixed(5)}, ${b[1].toFixed(5)}`;
  $('ficheBtn').href = ficheUrl(b);
  if (origin) {
    const m = dist(origin.lat, origin.lon, b[0], b[1]);
    const [v, u] = fmt(m);
    $('dist').innerHTML = `${v}<small>${u}</small>`;
    const br = bearing(origin.lat, origin.lon, b[0], b[1]);
    $('eta').textContent = eta(m);
    $('dirTxt').textContent = `vers le ${CARD[Math.round(br / 45) % 8]}`;
    $('arrow').style.transform = `rotate(${br - (heading ?? 0)}deg)`;
    $('dirBtn').hidden = false;
    $('tagLabel').textContent = selected === nearest[0] ? (origin.fromGps ? 'La plus proche de toi' : 'La plus proche de l’adresse') : 'Boîte sélectionnée';
    const walking = m < 3000, L2 = navLinks(b, walking);
    $('gmaps').href = L2.g; $('amaps').href = L2.a; $('waze').href = L2.w;
    $('goBtn').href = IS_APPLE ? L2.a : L2.g;
    $('goLabel').textContent = walking ? 'Y aller à pied' : 'Y aller';
    $('pdist').innerHTML = `${v}<small>${u}</small>`;
    $('peta').textContent = `${eta(m)} · vers le ${CARD[Math.round(br / 45) % 8]}`;
    if (line) line.setLatLngs([[origin.lat, origin.lon], [b[0], b[1]]]);
    else line = L.polyline([[origin.lat, origin.lon], [b[0], b[1]]], { color: css('--a2'), weight: 4, opacity: .9, dashArray: '1 9', lineCap: 'round' }).addTo(map);
  } else {
    $('dist').textContent = ''; $('dirBtn').hidden = true;
    $('eta').textContent = 'Localise-toi pour voir la distance';
    $('tagLabel').textContent = 'Boîte sélectionnée';
    const L2 = navLinks(b, true);
    $('gmaps').href = L2.g; $('amaps').href = L2.a; $('waze').href = L2.w;
    $('goBtn').href = IS_APPLE ? L2.a : L2.g; $('goLabel').textContent = 'Y aller';
    $('pdist').textContent = ''; $('peta').textContent = 'Localise-toi pour la distance';
  }
  $('paddr').textContent = b[3] || `Boîte n° ${b[2]}`;
  $('pgo').href = $('goBtn').href;
  $('more').hidden = !origin;
  $('list').innerHTML = '';
  for (const i of nearest) {
    const n = boxes[i], li = document.createElement('li'), bt = document.createElement('button');
    bt.innerHTML = `<span class="a"></span><span class="d">${fmtTxt(dist(origin.lat, origin.lon, n[0], n[1]))}</span>`;
    bt.querySelector('.a').textContent = n[3] || `Boîte n° ${n[2]}`;
    if (i === selected) bt.setAttribute('aria-current', 'true');
    bt.onclick = () => setSelected(i, { fit: true });
    li.append(bt); $('list').append(li);
  }
}

function setOrigin(lat, lon, fromGps, acc) {
  const first = !origin;
  const moved = origin ? dist(origin.lat, origin.lon, lat, lon) : Infinity;
  origin = { lat, lon, fromGps };
  if (!meMarker) meMarker = L.marker([lat, lon], { icon: L.divIcon({ className: '', html: '<div class="me"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }), zIndexOffset: 2000, interactive: false }).addTo(map);
  else meMarker.setLatLng([lat, lon]);
  if (acc && fromGps) { meCircle ? meCircle.setLatLng([lat, lon]).setRadius(acc) : (meCircle = L.circle([lat, lon], { radius: acc, weight: 0, color: css('--me'), fillOpacity: .1, interactive: false }).addTo(map)); }
  else if (meCircle) { map.removeLayer(meCircle); meCircle = null; }
  $('locateBtn').classList.toggle('on', fromGps);
  try { localStorage.setItem('bal-last', JSON.stringify([lat, lon])); } catch (e) {}
  if (first || moved > 40 || !fromGps) {
    const prevFirst = nearest[0];
    computeNearest();
    // On suit la plus proche, sauf si l'utilisateur a choisi une autre boîte
    if (selected === null || selected === prevFirst || !fromGps) { setSelected(nearest[0], { fit: first || !fromGps }); return; }
  }
  render();
}

// --- Localisation
let watchId = null;
function locate() {
  if (!('geolocation' in navigator)) { $('status').textContent = "Ce navigateur ne donne pas accès à la position. Cherche une adresse en haut."; return; }
  $('status').textContent = 'Recherche de ta position…';
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  let centered = false;
  watchId = navigator.geolocation.watchPosition(p => {
    $('status').textContent = '';
    setOrigin(p.coords.latitude, p.coords.longitude, true, p.coords.accuracy);
    if (!centered && nearest.length) setSelected(nearest[0], { fit: true });
    centered = true;
  }, err => {
    const msg = err.code === 1 ? "Localisation refusée. Autorise-la dans les réglages du navigateur, ou cherche une adresse."
      : "Position introuvable pour l'instant. Réessaie, ou cherche une adresse.";
    $('status').textContent = msg;
    if (!$('detail').hidden) $('eta').textContent = msg;
  }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}
$('locateBtn').onclick = locate;
$('startBtn').onclick = locate;

// Boussole (orientation de l'appareil) : la flèche pointe vers la boîte
function onOrient(e) {
  const h = e.webkitCompassHeading ?? (e.absolute && e.alpha != null ? 360 - e.alpha : null);
  if (h == null) return;
  heading = h;
  if (origin && selected !== null) {
    const b = boxes[selected];
    $('arrow').style.transform = `rotate(${bearing(origin.lat, origin.lon, b[0], b[1]) - heading}deg)`;
  }
}
$('dirBtn').onclick = async () => {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) {
      if (await DeviceOrientationEvent.requestPermission() !== 'granted') return;
    }
    window.addEventListener('deviceorientationabsolute', onOrient);
    window.addEventListener('deviceorientation', onOrient);
    $('dirBtn').title = 'Boussole activée';
  } catch (e) {}
};

// --- Fiche pliable : poignée (tap ou glisser), tap sur la ligne pliée, pliage auto quand on déplace la carte
function setMini(on) {
  $('card').classList.toggle('mini', on);
  $('grab').setAttribute('aria-expanded', String(!on));
}
const isMini = () => $('card').classList.contains('mini');
let dragY = null, dragged = false;
for (const el of [$('grab'), $('peek')]) {
  el.addEventListener('pointerdown', e => { if (e.target.closest('.pgo')) return; dragY = e.clientY; dragged = false; });
}
window.addEventListener('pointermove', e => {
  if (dragY === null) return;
  const dy = e.clientY - dragY;
  if (Math.abs(dy) > 24) { dragged = true; setMini(dy > 0); dragY = null; }
});
window.addEventListener('pointerup', () => { dragY = null; });
$('grab').addEventListener('click', () => { if (!dragged) setMini(!isMini()); dragged = false; });
$('peek').addEventListener('click', e => { if (e.target.closest('.pgo') || dragged) { dragged = false; return; } setMini(false); });
$('peek').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setMini(false); } });
map.on('dragstart', () => setMini(true));

// --- Recherche d'adresse (Base Adresse Nationale)
let qTimer = null;
$('q').addEventListener('input', () => {
  clearTimeout(qTimer);
  const q = $('q').value.trim();
  if (q.length < 3) { $('results').hidden = true; return; }
  qTimer = setTimeout(() => search(q), 250);
});
$('searchForm').addEventListener('submit', e => { e.preventDefault(); const f = $('results').querySelector('button'); if (f) f.click(); });
async function search(q) {
  try {
    const r = await fetch(`https://api-adresse.data.gouv.fr/search/?q=${encodeURIComponent(q)}&limit=5`);
    const j = await r.json();
    const ul = $('results'); ul.innerHTML = '';
    for (const f of j.features) {
      const li = document.createElement('li'), bt = document.createElement('button');
      bt.type = 'button';
      bt.innerHTML = '<span class="l"></span><small></small>';
      bt.querySelector('.l').textContent = f.properties.label;
      bt.querySelector('small').textContent = f.properties.context;
      bt.onclick = () => {
        ul.hidden = true; $('q').value = f.properties.label; $('q').blur();
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        const [lon, lat] = f.geometry.coordinates;
        setOrigin(lat, lon, false);
      };
      li.append(bt); ul.append(li);
    }
    ul.hidden = !j.features.length;
  } catch (e) { $('results').hidden = true; }
}
document.addEventListener('click', e => { if (!e.target.closest('.top')) $('results').hidden = true; });

// --- Données
fetch('data/boites.json').then(r => r.json()).then(data => {
  boxes = data;
  $('count').textContent = boxes.length.toLocaleString('fr-FR');
  const list = boxes.map((b, i) => {
    const m = L.marker([b[0], b[1]], { icon: ICON, title: b[3] });
    m.on('click', () => { setSelected(i); setMini(false); });
    markers.set(i, m);
    return m;
  });
  cluster.addLayers(list);
  // Reprend la dernière position connue en attendant le GPS
  try {
    const last = JSON.parse(localStorage.getItem('bal-last') || 'null');
    if (last) map.setView(last, 14);
  } catch (e) {}
  if (navigator.permissions) navigator.permissions.query({ name: 'geolocation' }).then(p => { if (p.state === 'granted') locate(); }).catch(() => {});
});
</script>
